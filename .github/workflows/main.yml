# LunchMate: flat files -> Android APK
# Put this file in your repo at:  .github/workflows/build-apk.yml
# Keep all the other files flat in the repo root (same place as package.json).
name: Build LunchMate APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (icons)
        run: pip install pillow

      - name: Install npm packages
        run: npm install

      - name: Build the web folder (www) from the flat files
        run: |
          set -e
          mkdir -p www/icons www/fonts icons
          cp index.html app.js notebook.js styles.css notebook.css www/
          python3 icons.py
          cp icons/*.png www/icons/
          F=node_modules/@fontsource
          for w in 300 400 500 600 700; do cp "$F/inter/files/inter-latin-$w-normal.woff2" "www/fonts/inter-$w.woff2"; done
          cp "$F/dm-serif-display/files/dm-serif-display-latin-400-normal.woff2" www/fonts/dm-serif-display-400.woff2
          for w in 500 700 800; do cp "$F/jetbrains-mono/files/jetbrains-mono-latin-$w-normal.woff2" "www/fonts/jetbrains-mono-$w.woff2"; done
          ls -R www | head -50

      - name: Create the Android project
        run: npx cap add android

      - name: Apply native changes (icons, widget, share target, notifications, backup saving)
        run: python3 native.py

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LunchMate-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
